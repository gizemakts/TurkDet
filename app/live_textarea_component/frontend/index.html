<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; background: transparent; overflow: hidden; }
    body {
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      opacity: 0;
      transition: opacity .08s ease;
    }
    body.ready { opacity: 1; }
    textarea {
      display: block;
      width: 100%;
      min-width: 100%;
      max-width: 100%;
      resize: none;
      border-radius: 16px;
      padding: 16px 17px;
      font: 400 14px/1.6 Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--field, transparent);
      color: var(--text, inherit);
      border: 1px solid var(--border, transparent);
      outline: none;
      box-shadow: var(--shadow, none);
      transition: border-color .16s ease, box-shadow .16s ease, background-color .12s ease, color .12s ease;
    }
    textarea::placeholder { color: var(--muted, inherit); opacity: .78; }
    textarea:focus {
      border-color: rgba(99,102,241,.78);
      box-shadow: 0 0 0 3px rgba(99,102,241,.10), var(--shadow, none);
    }
  </style>
</head>
<body>
  <textarea id="editor" spellcheck="true" aria-label="Türkçe metin"></textarea>

  <script>
    const SET_COMPONENT_VALUE = "streamlit:setComponentValue";
    const RENDER = "streamlit:render";
    const COMPONENT_READY = "streamlit:componentReady";
    const SET_FRAME_HEIGHT = "streamlit:setFrameHeight";

    const editor = document.getElementById("editor");
    let debounceTimer = null;
    let debounceMs = 180;

    function sendMessage(type, data) {
      window.parent.postMessage(Object.assign({
        isStreamlitMessage: true,
        type: type,
      }, data || {}), "*");
    }

    function setFrameHeight(height) {
      sendMessage(SET_FRAME_HEIGHT, { height: height });
    }

    function setComponentValue(value) {
      sendMessage(SET_COMPONENT_VALUE, { value: value, dataType: "json" });
    }

    function applyProps(props) {
      const nextValue = typeof props.value === "string" ? props.value : "";
      const active = document.activeElement === editor;

      // While the user is actively typing, a Streamlit rerun can arrive with a
      // slightly older value than the browser currently contains. Never replace
      // focused local edits with that stale prop. Once focus leaves the editor,
      // blur commits the latest value and future renders may safely resync it.
      if (!active && editor.value !== nextValue) {
        editor.value = nextValue;
      }

      editor.placeholder = props.placeholder || "";
      debounceMs = Number.isFinite(Number(props.debounce_ms)) ? Number(props.debounce_ms) : 180;

      const height = Math.max(120, Number(props.height) || 300);
      editor.style.height = `${height}px`;
      document.documentElement.style.setProperty("--field", props.field_color || "transparent");
      document.documentElement.style.setProperty("--text", props.text_color || "inherit");
      document.documentElement.style.setProperty("--muted", props.muted_color || "inherit");
      document.documentElement.style.setProperty("--border", props.border_color || "transparent");
      document.documentElement.style.setProperty("--shadow", props.shadow || "none");
      document.body.classList.add("ready");
      setFrameHeight(height + 2);
    }

    window.addEventListener("message", (event) => {
      if (event.data && event.data.type === RENDER) {
        applyProps(event.data.args || {});
      }
    });

    editor.addEventListener("input", () => {
      window.clearTimeout(debounceTimer);
      debounceTimer = window.setTimeout(() => {
        setComponentValue(editor.value);
      }, debounceMs);
    });

    editor.addEventListener("blur", () => {
      window.clearTimeout(debounceTimer);
      setComponentValue(editor.value);
    });

    sendMessage(COMPONENT_READY, { apiVersion: 1 });
    setFrameHeight(302);
  </script>
</body>
</html>
